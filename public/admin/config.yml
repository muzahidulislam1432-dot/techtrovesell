backend:
  name: github
  repo: muzahidulislam1432-dot/techtrovesell
  branch: main
  base_url: base_url: https://sveltia-cms-auth.muzahidulislam1432.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads
publish_mode: editorial_workflow

site_url: https://techtrovesell.com
display_url: https://techtrovesell.com
logo_url: https://techtrovesell.com/images/techtrovestore-profile.png

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: reviews
    label: Product Reviews
    label_singular: Product Review
    folder: src/content/reviews
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    summary: '{{title}} — {{status}}'
    sortable_fields: [title, publishedAt, category, status]
    fields:
      - { label: Product / Review Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string, hint: 'Example: logitech-mx-master-3s-review' }
      - { label: Status, name: status, widget: select, options: [draft, published], default: draft }
      - { label: Brand, name: brand, widget: string, required: false }
      - { label: Category Slug, name: category, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name] }
      - { label: Short Excerpt, name: excerpt, widget: text }
      - { label: Featured Image, name: image, widget: image }
      - { label: Image Alt Text, name: imageAlt, widget: string }
      - { label: Amazon Affiliate URL, name: amazonUrl, widget: string, default: '#', hint: 'Paste the complete SiteStripe affiliate link.' }
      - { label: CTA Button Text, name: ctaText, widget: string, default: 'Check price on Amazon' }
      - { label: Review Badge, name: badge, widget: string, default: 'Product Review' }
      - { label: Verdict, name: verdict, widget: text }
      - { label: Best For, name: bestFor, widget: text }
      - { label: Avoid If, name: avoidIf, widget: text }
      - label: Pros
        name: pros
        widget: list
        field: { label: Pro, name: item, widget: string }
      - label: Cons
        name: cons
        widget: list
        field: { label: Con, name: item, widget: string }
      - label: Key Features
        name: features
        widget: list
        field: { label: Feature, name: item, widget: string }
      - label: Specifications
        name: specs
        widget: list
        fields:
          - { label: Specification, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - label: FAQs
        name: faqs
        widget: list
        required: false
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: slug, display_fields: [name], required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false }
      - { label: SEO Description, name: seoDescription, widget: text, required: false }
      - { label: Publish Date, name: publishedAt, widget: datetime, required: false }
      - { label: Updated Date, name: updatedAt, widget: datetime, required: false }
      - { label: Article Body, name: body, widget: markdown }

  - name: guides
    label: Buying Guides
    label_singular: Buying Guide
    folder: src/content/guides
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    summary: '{{title}} — {{status}}'
    fields:
      - { label: Guide Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Status, name: status, widget: select, options: [draft, published], default: draft }
      - { label: Category, name: category, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name] }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Featured Image, name: image, widget: image }
      - { label: Image Alt Text, name: imageAlt, widget: string }
      - { label: Read Time, name: readTime, widget: string, default: '8 min read' }
      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: slug, display_fields: [name], required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false }
      - { label: SEO Description, name: seoDescription, widget: text, required: false }
      - { label: Publish Date, name: publishedAt, widget: datetime, required: false }
      - { label: Updated Date, name: updatedAt, widget: datetime, required: false }
      - { label: Guide Content, name: body, widget: markdown }

  - name: comparisons
    label: Product Comparisons
    label_singular: Product Comparison
    folder: src/content/comparisons
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    summary: '{{title}} — {{status}}'
    fields:
      - { label: Comparison Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Status, name: status, widget: select, options: [draft, published], default: draft }
      - { label: Category, name: category, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name] }
      - { label: Product A, name: productA, widget: string }
      - { label: Product B, name: productB, widget: string }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Winner / Quick Result, name: winner, widget: text }
      - label: Comparison Rows
        name: rows
        widget: list
        fields:
          - { label: Feature, name: feature, widget: string }
          - { label: Product A Value, name: a, widget: string }
          - { label: Product B Value, name: b, widget: string }
      - { label: Product A Affiliate URL, name: amazonUrlA, widget: string, required: false }
      - { label: Product B Affiliate URL, name: amazonUrlB, widget: string, required: false }
      - { label: SEO Title, name: seoTitle, widget: string, required: false }
      - { label: SEO Description, name: seoDescription, widget: text, required: false }
      - { label: Publish Date, name: publishedAt, widget: datetime, required: false }
      - { label: Comparison Content, name: body, widget: markdown }

  - name: deals
    label: Deals
    label_singular: Deal
    folder: src/content/deals
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    summary: '{{title}} — {{status}}'
    fields:
      - { label: Deal Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Status, name: status, widget: select, options: [draft, published], default: draft }
      - { label: Category, name: category, widget: relation, collection: categories, search_fields: [name, slug], value_field: slug, display_fields: [name] }
      - { label: Product Image, name: image, widget: image }
      - { label: Image Alt Text, name: imageAlt, widget: string }
      - { label: Short Description, name: excerpt, widget: text }
      - { label: Amazon Affiliate URL, name: amazonUrl, widget: string }
      - { label: Deal Label, name: dealLabel, widget: string, default: 'Featured Deal' }
      - { label: Expiry Note, name: expiryNote, widget: string, required: false, hint: 'Do not use fake urgency. Add only a verified expiry note.' }
      - { label: Publish Date, name: publishedAt, widget: datetime, required: false }
      - { label: Deal Content, name: body, widget: markdown }

  - name: categories
    label: Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Icon / Emoji, name: icon, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Display Order, name: order, widget: number, value_type: int }

  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: Role, name: role, widget: string, default: 'Editor' }
      - { label: Profile Photo, name: image, widget: image, required: false }
      - { label: Short Bio, name: bio, widget: text }
      - { label: Full Biography, name: body, widget: markdown }

  - name: pages
    label: Pages and Legal Policies
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.slug}}'
    fields:
      - { label: Page Title, name: title, widget: string }
      - { label: URL Slug, name: slug, widget: string }
      - { label: SEO Description, name: seoDescription, widget: text }
      - { label: Updated Date, name: updatedAt, widget: datetime, required: false }
      - { label: Page Content, name: body, widget: markdown }

  - name: settings
    label: Website Settings
    files:
      - label: Main Website Settings
        name: site
        file: src/content/settings/site.md
        fields:
          - { label: Website Name, name: siteName, widget: string }
          - { label: Social Brand Name, name: socialBrandName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Business Email, name: businessEmail, widget: string }
          - { label: Amazon Tracking ID, name: amazonTag, widget: string, required: false }
          - { label: Facebook Page URL, name: facebookUrl, widget: string, required: false }
          - { label: Pinterest URL, name: pinterestUrl, widget: string, required: false }
          - { label: YouTube URL, name: youtubeUrl, widget: string, required: false }
          - { label: Homepage SEO Title, name: homepageTitle, widget: string }
          - { label: Homepage SEO Description, name: homepageDescription, widget: text }
          - { label: Homepage Hero Heading, name: heroHeading, widget: string }
          - { label: Homepage Hero Text, name: heroText, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, default: '/images/techtrovestore-cover.png' }
          - { label: Homepage CTA Text, name: primaryCtaText, widget: string, default: 'Explore reviews' }
          - { label: Homepage CTA URL, name: primaryCtaUrl, widget: string, default: '/reviews/' }
